name: Deploy to Vercel (production)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run unit/integration tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke E2E test
        run: pnpm exec playwright test tests/smoke/golden-path.spec.ts
        env:
          NEXT_PUBLIC_TRAVELPAYOUTS_MARKER: ${{ secrets.NEXT_PUBLIC_TRAVELPAYOUTS_MARKER }}

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Pull Vercel environment
        run: pnpm dlx vercel@57.0.0 pull --yes --environment=production

      - name: Build via Vercel CLI
        run: pnpm dlx vercel@57.0.0 build --prod
        env:
          NEXT_PUBLIC_TRAVELPAYOUTS_MARKER: ${{ secrets.NEXT_PUBLIC_TRAVELPAYOUTS_MARKER }}

      - name: Deploy prebuilt output
        run: pnpm dlx vercel@57.0.0 deploy --prebuilt --prod
